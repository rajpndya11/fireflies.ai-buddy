<script>
const SCREENS=[
 ["recap","Meeting recap","Tuesday's Product Sync just ended. Fireflies extracted 5 commitments, but nobody owns them yet."],
 ["slack","Claim Card","Only Raj gets this card, in Slack. One tap per item: Yes, mine (with a date and private priority), Not mine, or Not a commitment."],
 ["tasks","Tasks","Claimed items live in the existing Tasks tab and sync to Asana. 'Owed to me' shows what others promised Raj."],
 ["loops","Open Loops","A week later, 30 min before the next sync. The follow-up agent already closed what Asana proves; Raj settles the rest with one tap."],
 ["brief","Meeting brief","The shared brief shows what closed since last time, so the meeting skips the repeats."],
 ["analytics","Analytics","Managers see team-level follow-through only, never a per-person list."],
 ["remind","Reminders","Priority decides how Raj is reminded, within a hard cap of 2 alerts a week. No AI phone calls."],

/* Priority badge: private to the owner. Open items get a dropdown + quick toggle; closed items show a static badge. */
function prio(i){

  const open=S.prioMenu===i.id;
  return `<span class="prio-wrap">

    ${open?`<div class="prio-menu" role="menu" aria-label="Set priority">${PRIOS.map(x=>`<button role="menuitemradio" aria-checked="${x===p}" data-act="prio-set" data-prio="${x}" data-id="${i.id}"><span class="dot ${x}"></span>${PLABEL[x]}${x===p?' <span class="meta" style="margin-left:auto">✓</span>':""}</button>`).join("")}<div class="meta" style="padding:6px 8px 2px">Only you see this. It sets how you're reminded.</div></div>`:""}
  </span>`;
}

/* Reducer: every state change goes through here. */
function reducer(st,a){
  const i=a.id?st.items.find(x=>x.id===a.id):null;
  switch(a.type){
    case "claim": i.due=a.due||i.due; if(a.priority)i.priority=a.priority; i.status="claimed"; break;
    case "notmine": i.status="notmine"; break;
    case "reject": i.status="rejected"; break;
    case "accept": i.status="claimed"; i.type="self"; break;
    case "decline": i.status="declined"; break;
    case "done": i.status="done"; break;
    case "still": i.status="still"; break;
    case "hand": st.handTo[i.id]=a.to; i.status="handed"; break;
    case "drop": st.dropReason[i.id]=a.reason; i.status="dropped"; break;
    case "prio-menu": st.prioMenu=st.prioMenu===a.id?null:a.id; break;
    case "prio-close": st.prioMenu=null; break;
    case "prio-set": if(i&&isOpen(i)){i.priority=a.priority} st.prioMenu=null; break;
    case "prio-cycle": if(i&&isOpen(i)){i.priority=PRIOS[(PRIOS.indexOf(i.priority||"medium")+1)%3]} st.prioMenu=null; break;
    case "notify-toggle": st.notify[a.channel]=a.value; break;
    case "sent": st.sent.push(a.key); break;
    case "agent-run":
      if(!st.agentRan){ st.agentRan=true;
        st.items.forEach(x=>{const ev=EVIDENCE[x.id]; if(!ev||x.owner!=="Raj"||!["claimed","still"].includes(x.status))return;
          if(ev.kind==="tracker"){x.status="done";x.closedBy="tracker"}   // the owner's own action in their tracker counts as their decision
          else {x.proposal=true}                                          // anything else is only a proposal
        }); }
      break;
    case "agent-yes": i.status="done"; i.closedBy="agent-confirmed"; i.proposal=false; break;
    case "agent-no": i.proposal=false; i.proposalDismissed=true; break;
  }
  return st;
}
const dispatch=a=>{S=reducer(S,a);render()};

/* Reminder plan: priority decides channel and timing; a hard budget of 2 proactive alerts per person per week. */
const BUDGET=2;
function reminderPlan(){
  const mine=S.items.filter(i=>i.owner==="Raj"&&["claimed","still"].includes(i.status));
  const rank={high:0,medium:1,low:2};
  const sorted=[...mine].sort((a,b)=>rank[a.priority]-rank[b.priority]);
  let used=0;
  return sorted.map(i=>{
    let plan;
    if(i.priority==="high") plan={when:"24 h before due ("+i.due.replace(/^\w+, /,"")+", 10:00 AM)",ch:"Push + browser"};
    else if(i.priority==="medium") plan={when:"In the Open Loops check, 30 min before Product Sync",ch:"Browser"};
    else plan={when:"No alert. Listed in the Open Loops check only",ch:"None"};
    if(plan.ch!=="None"){ if(used<BUDGET){used++;plan.sched=true} else {plan.sched=false;plan.when="Over the 2-a-week budget: folded into the Open Loops check";plan.ch="None"} }
    return {i,...plan};
  });
}
function fireReminder(i){
  const title=(i.priority==="high"?"Due soon: ":"Before Product Sync: ")+i.text;
  const body="For "+i.to+" · due "+i.due+". Tap to mark Done, Still on it, Hand off or Drop.";
  let real=false;
  if(S.notify.web&&"Notification" in window&&Notification.permission==="granted"){try{new Notification(title,{body,tag:i.id});real=true}catch(e){}}
  const w=$("#webn"); w.innerHTML=`<div class="src">${real?"Browser notification sent":"Preview"} · Fireflies</div><b>${esc(title)}</b><div style="margin-top:2px">${esc(body)}</div>`; w.hidden=false;
  clearTimeout(fireReminder.t); fireReminder.t=setTimeout(()=>w.hidden=true,4200);
}

function go(name){if(name==="loops"&&!S.agentRan)S=reducer(S,{type:"agent-run"});S.screen=name;try{if(location.hash!=="#"+name)history.replaceState(null,"","#"+name)}catch(err){/* sandboxed previews block URL changes; navigation still works */}render()}
function render(){

}

      <label class="meta">Hand off to <select id="hand-${i.id}" aria-label="Hand off to">${PEOPLE.map(p=>`<option>${p}</option>`).join("")}</select></label>
      <button class="btn" data-act="hand" data-id="${i.id}">Hand off</button></div>
      <div class="chips" aria-label="Drop with optional reason">${reasons.map(r=>`<button class="chip" data-act="drop" data-reason="${r}" data-id="${i.id}">Drop · ${r}</button>`).join("")}</div></div>`;
  };
  open.sort((a,b)=>PRIOS.indexOf(a.priority)-PRIOS.indexOf(b.priority));
  return `<h1>Open Loops</h1><p class="sub">Tue, Nov 3 · 2:30 PM, 30 minutes before Product Sync · Week 45. Private to Raj. High priority first.</p>
  <div class="slack"><div class="slack-top"># Direct message <span>· Fireflies app</span></div>
  <div class="msg"><div class="bot" aria-hidden="true"></div><div class="body"><b>Fireflies</b><span class="app-badge">APP</span>
   <div style="margin-top:4px">You have <b>${open.filter(i=>i.status==="claimed"||i.status==="still").length}</b> open from last week's Product Sync. A quick update keeps the meeting short.</div>

   <p class="note">Dropping counts as closing. Nobody is told you “failed”. The follow-up agent checks your own tracker and later recorded meetings for proof an item is done; it never chases you or tells your manager.</p>
  </div></div></div>
  <div class="btns"><button class="btn" data-go="brief">Next: the shared meeting brief</button></div>`;
};

V.brief=()=>{
  const all=S.items.filter(i=>i.type!=="unowned"&&!["rejected","notmine","declined","pending"].includes(i.status));
  const closed=all.filter(i=>resolved(i.status)), open=all.filter(i=>!resolved(i.status));
  const label=i=>i.status==="dropped"?"closed · no longer planned":i.status==="handed"?"handed off to "+S.handTo[i.id]:"done";
  return `<h1>Meeting brief</h1><p class="sub">Product Sync · Week 45 · today 3:00 PM · visible to attendees of this series</p>
  <div class="grid2"><div class="card"><h2>Closed since last time (${closed.length})</h2>
   ${closed.length?closed.map(i=>`<div class="item"><div class="t">${esc(i.text)}<div class="meta">${esc(i.owner)} · ${label(i)}</div></div>${pill(i.status)}</div>`).join(""):`<div class="empty">Nothing closed yet. Use Open Loops to close an item.</div>`}</div>
   <div class="card"><h2>Still open (${open.length})</h2>
   ${open.map(i=>`<div class="item"><div class="t">${esc(i.text)}<div class="meta">${esc(i.owner)} · due ${esc(i.due)}</div></div>${pill(i.status)}</div>`).join("")||`<div class="empty">All clear.</div>`}

   <div class="btns"><button class="btn" data-go="analytics">Next: what managers and buyers see</button></div>`;
};

    <div class="legend"><span><i style="background:#3fbf7f"></i>Done 79%</span><span><i style="background:#7b5cff"></i>Handed off 9%</span><span><i style="background:#6b6b78"></i>Dropped 12%</span></div>
    <p class="note">Drops + hand-offs at 21% sit inside the 10–25% honesty band.</p>

     <tr><td>Reminders per person per week</td><td class="mono">1.6</td><td><span class="pill p-done">≤ 2</span></td></tr>

const SAMPLE=`Raj: I'll send the revised onboarding deck to Priya by Friday.
Priya: Raj, can you look into the Safari login bug before Monday?
Raj: Sure, on it.
Mansi: Someone should update the pricing FAQ.
Arjun: I already shipped the webhook fix yesterday.
Neha: I might maybe look at the analytics export if I get time.
Arjun: I will draft the rate-limit proposal by Thursday.
Mansi: We should probably revisit the roadmap next quarter.`;
let labText=SAMPLE,labOut=null;
function route(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([A-Za-z]+):\s*(.*)$/);return m?{sp:m[1],t:m[2]}:{sp:"?",t:l}});
  const verbs=/\b(send|share|review|draft|fix|look into|schedule|update|follow up|write|prepare|ship|check|call|email|book)\b/i;
  const days=/\b(today|tomorrow|monday|tuesday|wednesday|thursday|friday|eod|eow|next week|by \w+day)\b/i;
  const hedge=/\b(maybe|might|probably|try|if i get time|at some point)\b/i;
  return lines.map((L,idx)=>{
    let type="none",conf=0,owner=null,why=[];
    const t=L.t;
    if(/\b(i already|i did|i would|i shipped|yesterday)\b/i.test(t)){why.push("past or hypothetical")}
    else if(/\b(i'll|i will|i can|let me|i'm going to)\b/i.test(t)){type="self";conf=.7;owner=L.sp;why.push("first-person promise")}
    else if(/^[A-Z][a-z]+,\s*(can|could|would) you/.test(t)||/\b(can|could) you\b/i.test(t)){type="request";conf=.6;owner=null;why.push("request to named person")}
    else if(/\b(someone should|we should|we need to)\b/i.test(t)){type="unowned";conf=.45;why.push("no owner")}
    if(type!=="none"){
      if(verbs.test(t)){conf+=.1;why.push("action verb")}
      const d=t.match(days); if(d){conf+=.1;why.push("due: "+d[0])}
      if(hedge.test(t)){conf-=.25;why.push("hedged")}
      if(type==="request"){const nx=lines[idx+1];const name=(t.match(/^([A-Z][a-z]+),/)||[])[1];if(nx&&name&&nx.sp===name&&/\b(sure|yes|on it|will do|ok)\b/i.test(nx.t)){type="self";owner=name;conf+=.15;why.push("accepted by "+name)}}
    }
    conf=Math.max(0,Math.min(.99,conf));
    let r="Gate out (logged)";
    if(type==="self")r=conf>=.8?"Claim Card → "+owner:conf>=.5?"“Did you mean this?” → "+owner:"Gate out (logged)";
    if(type==="request")r="Request card → named person (needs Accept)";
    if(type==="unowned")r=conf>=.4?"Host's Unowned list":"Gate out (logged)";
    if(type==="none"&&!why.length)why.push("no commitment language");
    const due=(t.match(days)||["—"])[0];
    return {sp:L.sp,t,type,conf,owner:owner||"—",due,r,why:why.join(", ")};
  });
}
V.lab=()=>{
  return `<h1>AI Skill · Commitment Router</h1><p class="sub">The rules from Step 8, running live. Edit the transcript (format “Name: line”) and route it.</p>
  <div class="card"><label for="lab-in" class="meta">Transcript</label><textarea id="lab-in">${esc(labText)}</textarea>
   <div class="btns"><button class="btn pri" id="run">Route commitments</button><button class="btn" id="sample">Load sample</button></div></div>
  ${labOut?`<div class="card tw" style="margin-top:16px"><table><thead><tr><th>Speaker</th><th>Line</th><th>Type</th><th>Owner</th><th>Due</th><th>Confidence</th><th>Routed to</th><th>Why</th></tr></thead><tbody>
   ${labOut.map(o=>`<tr><td>${esc(o.sp)}</td><td>${esc(o.t)}</td><td class="mono">${o.type}</td><td>${esc(o.owner)}</td><td>${esc(o.due)}</td><td class="mono"><span class="bar"><i style="width:${Math.round(o.conf*100)}%"></i></span>${o.conf.toFixed(2)}</td><td>${esc(o.r)}</td><td class="meta">${esc(o.why)}</td></tr>`).join("")}
  </tbody></table></div>`:""}`;
};

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return}
  const tb=e.target.closest("[data-tab]"); if(tb){S.tasksTab=tb.dataset.tab;render();return}
  if(e.target.id==="reset"){S=INIT();labOut=null;labText=SAMPLE;go("home");toast("Demo reset");return}
  if(e.target.id==="start"){go(SCREENS[0][0]);return}
  if(e.target.id==="next"||e.target.id==="prev"){const n=SCREENS.findIndex(x=>x[0]===S.screen);
    if(e.target.id==="next"){ if(n<0)go(SCREENS[0][0]); else if(n===SCREENS.length-1){go("home");toast("Demo complete. Use Reset to run it again")} else go(SCREENS[n+1][0]); }
    else if(n>0) go(SCREENS[n-1][0]); return}
  if(e.target.id==="run"){labText=$("#lab-in").value;labOut=route(labText);render();return}
  if(e.target.id==="sample"){labText=SAMPLE;labOut=route(SAMPLE);render();return}
  const a=e.target.closest("[data-act]");
  if(!a){ if(S.prioMenu&&!e.target.closest(".prio-wrap")) dispatch({type:"prio-close"}); return; }
  const id=a.dataset.id, act=a.dataset.act, i=id?get(id):null;
  if(act==="claim"){const s=$("#due-"+id);dispatch({type:"claim",id,due:s?s.value:null});toast("Owned · added to Asana, due "+i.due+" · priority "+PLABEL[i.priority]);return}
  if(act==="notmine"){dispatch({type:"notmine",id});toast("Thanks. We'll ask who it belongs to, not assign it");return}
  if(act==="reject"){dispatch({type:"reject",id});toast("Removed. This helps Fireflies learn");return}
  if(act==="accept"){dispatch({type:"accept",id});toast("Accepted · Priya will hear when it's done");return}
  if(act==="decline"){dispatch({type:"decline",id});toast("Declined · Priya has been told");return}
  if(act==="done"){dispatch({type:"done",id});toast("Closed as done · "+i.to+" notified");return}
  if(act==="still"){dispatch({type:"still",id});toast("Kept open · no one is nudged");return}
  if(act==="hand"){dispatch({type:"hand",id,to:$("#hand-"+id).value});toast("Handed off to "+S.handTo[id]+" (they accepted)");return}
  if(act==="drop"){dispatch({type:"drop",id,reason:a.dataset.reason});toast("Closed · dropped. That counts as resolved");return}
  if(act==="prio-menu"){dispatch({type:"prio-menu",id});const m=document.querySelector(".prio-menu [aria-checked=true]");if(m)m.focus();return}
  if(act==="prio-set"){dispatch({type:"prio-set",id,priority:a.dataset.prio});toast("Priority set to "+PLABEL[a.dataset.prio]+" · only you see it");return}
  if(act==="prio-cycle"){dispatch({type:"prio-cycle",id});toast("Priority: "+PLABEL[get(id).priority]);return}
  if(act==="notify"){const ch=a.dataset.channel,v=!S.notify[ch];
    if(ch==="web"&&v&&"Notification" in window&&Notification.permission==="default"){try{Notification.requestPermission().then(()=>render())}catch(err){}}
    dispatch({type:"notify-toggle",channel:ch,value:v});toast((ch==="web"?"Browser notifications ":"Mobile push ")+(v?"on":"off"));return}
  if(act==="test"){fireReminder(i);return}
  if(act==="agent-yes"){dispatch({type:"agent-yes",id});toast("Closed as done · "+i.to+" notified");return}
  if(act==="agent-no"){dispatch({type:"agent-no",id});toast("Kept open · the agent won't ask about this again");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.prioMenu){const id=S.prioMenu;dispatch({type:"prio-close"});const b=document.querySelector(`[data-act="prio-menu"][data-id="${id}"]`);if(b)b.focus()}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(V[h]&&h!==S.screen){S.screen=h;render()}});
const h0=location.hash.slice(1); if(V[h0])S.screen=h0;
render();
